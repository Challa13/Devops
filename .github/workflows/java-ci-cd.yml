# ===================================================================
# WORKFLOW: JAVA APPLICATION PIPELINE
# File Name: .github/workflows/java-ci-cd.yml
# ===================================================================

name: Java CI-CD Pipeline

# Trigger pipeline manually OR when code pushed to main branch
on:
  workflow_dispatch:
  push:
    branches: [ main ]

# Global reusable variables
env:
  APP_NAME: java-app
  IMAGE_TAG: ${{ github.run_number }}          # unique build number
  REGISTRY: yourcompany.jfrog.io              # Artifactory registry
  REPO: docker-local                          # Docker repo name
  NAMESPACE: dev                             # Kubernetes namespace

jobs:
  build-deploy:
    runs-on: ubuntu-latest                   # GitHub hosted Linux runner

    steps:

    # ---------------------------------------------------------------
    # STEP 1 - Login to GitHub and Clone Full Repository Code
    # checkout action downloads source code into runner
    # ---------------------------------------------------------------
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # ---------------------------------------------------------------
    # STEP 2 - Install Java JDK required to compile Maven project
    # Temurin is OpenJDK distribution
    # ---------------------------------------------------------------
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    # ---------------------------------------------------------------
    # STEP 3 - Validate project structure
    # Check pom.xml exists and show files
    # ---------------------------------------------------------------
    - name: Validate Code
      run: |
        ls -la
        test -f pom.xml || (echo "pom.xml missing" && exit 1)

    # ---------------------------------------------------------------
    # STEP 4 - Build executable JAR file
    # clean = remove old target folder
    # package = compile + create jar
    # skipTests = faster build
    # ---------------------------------------------------------------
    - name: Build JAR
      run: mvn clean package -DskipTests

    # ---------------------------------------------------------------
    # STEP 5 - Install Trivy vulnerability scanner
    # Used for JAR and Docker image scan
    # ---------------------------------------------------------------
    - name: Install Trivy
      run: |
        sudo apt-get update
        sudo apt-get install wget -y
        wget https://github.com/aquasecurity/trivy/releases/latest/download/trivy_0.50.1_Linux-64bit.deb
        sudo dpkg -i trivy_0.50.1_Linux-64bit.deb

    # ---------------------------------------------------------------
    # STEP 6 - Scan built JAR / dependencies for vulnerabilities
    # target/ contains jar + libraries
    # ---------------------------------------------------------------
    - name: Scan JAR Files
      run: trivy fs target/

    # ---------------------------------------------------------------
    # STEP 7 - Build Docker image using Dockerfile
    # Tag image with registry/repo/app:buildnumber
    # ---------------------------------------------------------------
    - name: Build Docker Image
      run: |
        docker build -t $REGISTRY/$REPO/$APP_NAME:$IMAGE_TAG .

    # ---------------------------------------------------------------
    # STEP 8 - Scan Docker image for OS/package vulnerabilities
    # ---------------------------------------------------------------
    - name: Scan Docker Image
      run: |
        trivy image $REGISTRY/$REPO/$APP_NAME:$IMAGE_TAG

    # ---------------------------------------------------------------
    # STEP 9 - Login to JFrog Artifactory registry
    # Credentials stored in GitHub Secrets
    # ---------------------------------------------------------------
    - name: Login to Artifactory
      run: |
        echo "${{ secrets.ART_PASS }}" | docker login $REGISTRY \
        -u "${{ secrets.ART_USER }}" --password-stdin

    # ---------------------------------------------------------------
    # STEP 10 - Push image to Artifactory repository
    # ---------------------------------------------------------------
    - name: Push Docker Image
      run: |
        docker push $REGISTRY/$REPO/$APP_NAME:$IMAGE_TAG

    # ---------------------------------------------------------------
    # STEP 11 - Install kubectl CLI
    # Required for Kubernetes deployment
    # ---------------------------------------------------------------
    - name: Setup kubectl
      uses: azure/setup-kubectl@v4

    # ---------------------------------------------------------------
    # STEP 12 - Configure kubeconfig and deploy new image
    # Updates deployment image and waits for rollout success
    # ---------------------------------------------------------------
    - name: Deploy to Kubernetes
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
        kubectl set image deployment/$APP_NAME \
        $APP_NAME=$REGISTRY/$REPO/$APP_NAME:$IMAGE_TAG -n $NAMESPACE
        kubectl rollout status deployment/$APP_NAME -n $NAMESPACE
